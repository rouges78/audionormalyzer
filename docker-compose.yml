version: '3.8'

services:
  # Production service
  audio-normalizer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TEMP_AUDIO_DIR=/app/temp/audio
      - OUTPUT_AUDIO_DIR=/app/output/audio
      - MAX_FILE_SIZE=524288000
      - MAX_ALBUM_SIZE=2147483648
    volumes:
      - audio_temp:/app/temp
      - audio_output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Development service
  audio-normalizer-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    profiles: ["dev"]

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - audio-normalizer
    profiles: ["proxy"]

volumes:
  audio_temp:
    driver: local
  audio_output:
    driver: local

networks:
  default:
    name: audio-normalizer-network