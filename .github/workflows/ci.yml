# Quality gate on every commit.
#
# Why it exists (test-10): build-release.yml already runs tests and build, but it starts
# only on v* tags or by hand. On normal commits to main nothing ran, and in fact
# maint-09 — the out-of-sync lockfile that would have made `npm ci` fail — stayed
# invisible for a whole day. This workflow is deliberately lightweight:
# no desktop build, no Docker, no images to publish. Only the three
# questions that matter before a merge: the types check out, the tests pass, and the
# dependencies can be installed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push that supersedes another on the same branch cancels the previous run:
# there is no point paying for CI on a commit that is already outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipi, test e audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 LTS. build-release.yml is still on 18, which has been out of support
          # since April 2025: to be aligned when that workflow is touched.
          node-version: '20'
          cache: 'npm'

      # `npm ci` instead of `npm install`: it follows the lockfile to the letter and
      # fails if it diverges from package.json. It is exactly the check that
      # was missing, and it is why maint-09 had gone unnoticed.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The three separate groups, instead of a single `vitest run`, to see
      # right away in the log which area broke. The filters are path
      # prefixes, not globs: see test-11.
      - name: Test — servizi
        run: npm run test:unit

      - name: Test — rotte API
        run: npm run test:api

      # Added on 03/08: the tests under lib/ were not covered by any of the
      # three historical groups, so 14 engine tests existed but nothing
      # ran them — CI included. This is also where EBU R128 conformance
      # on real files lives (test-02), which skips itself if ffmpeg is missing.
      - name: Test — engine e librerie
        run: npm run test:lib

      - name: Test — integrazione
        run: npm run test:integration

      # Informational, not blocking (sec-05). The remaining vulnerabilities are
      # all in the electron-builder tree and require majors (maint-10):
      # making them blocking today would mean a red CI on every PR, which after
      # two days nobody looks at anymore. The report goes into the run summary.
      - name: Audit dipendenze (informativo)
        if: always()
        run: |
          echo '## npm audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
